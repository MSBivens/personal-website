<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Bivens</title>

    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://win98icons.alexmeub.com/icons/png/windows-0.png"
    />

    <script src="/script.js" defer></script>
  </head>
  <body onclick="closeStartMenu(event)">
    <div class="desktop">
      <a class="icon" href="/ReadMe">
        <img
          src="https://win98icons.alexmeub.com/icons/png/notepad_file-0.png"
          class="icon-img"
          alt=""
        />
        ReadMe.txt
      </a>

      <a class="icon" href="/lists">
        <img
          src="https://win98icons.alexmeub.com/icons/png/notepad_file-2.png"
          class="icon-img"
          alt=""
        />
        lists.txt
      </a>

      <a class="icon" href="/illorim">
        <img
          src="https://win98icons.alexmeub.com/icons/png/world-0.png"
          class="icon-img"
          alt=""
        />
        Illorim.exe
      </a>

      <a
        class="icon"
        href="https://purpleelephant.tv/"
        target="_blank"
        rel="noopener"
      >
        <div style="position: relative; width: 32px; margin: 0 auto">
          <img
            src="https://win98icons.alexmeub.com/icons/png/executable_script-0.png"
            class="icon-img"
            alt=""
          />
          <img
            src="https://win98icons.alexmeub.com/icons/png/shortcut-0.png"
            style="
              position: absolute;
              bottom: 0;
              left: 0;
              width: 12px;
              height: 12px;
              image-rendering: pixelated;
            "
            alt=""
          />
        </div>
        PEP.LNK
      </a>

      <a class="icon" href="/stories">
        <img
          src="https://win98icons.alexmeub.com/icons/png/directory_closed-4.png"
          class="icon-img"
          alt=""
        />
        Explorer
      </a>
    </div>

    <div id="start-menu" class="start-menu" onclick="event.stopPropagation()">
      <div class="start-menu-sidebar">Windows 95</div>
      <a href="/" class="start-item">🏠 Home Desktop</a>
      <a href="/illorim" class="start-item">✨ Illorim (PEP)</a>
      <a href="/lists" class="start-item">📚 My Lists</a>
      <a href="/404" class="start-item">🚧 Construction</a>
      <hr style="width: 100%; margin: 0" />
      <a href="/shutdown" class="start-item">🚪 Shut Down...</a>
    </div>

    <div class="taskbar">
      <button type="button" id="start-button" onclick="toggleStartMenu(event)" aria-controls="start-menu" aria-expanded="false">
        <img
          src="https://win98icons.alexmeub.com/icons/png/windows-0.png"
          alt=""
        />
        Start
      </button>

      <div class="system-tray" id="clock">12:00 PM</div>
    </div>
  </body>
</html>
