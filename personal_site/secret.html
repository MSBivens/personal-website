<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unauthorized Access Detected</title>

    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--desktop-teal);
    "
  >
    <div class="prop-window" style="width: 400px; position: relative">
      <div class="title-bar">
        <span>System Alert</span>
        <div class="title-controls">
          <a href="/" aria-label="Close">X</a>
        </div>
      </div>

      <div class="prop-body" style="padding: 30px; text-align: center">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
            margin-bottom: 20px;
          "
        >
          <img
            src="https://win98icons.alexmeub.com/icons/png/msg_question-2.png"
            width="32"
            alt=""
          />
          <p style="font-size: 14px; font-weight: bold; margin: 0">
            How did you know that?
          </p>
        </div>

        <p style="font-size: 12px; color: #333; margin-bottom: 20px">
          The resonance frequency you provided matches a restricted archive key.
          This incident has been logged.
        </p>

        <div style="display: flex; justify-content: center; gap: 10px">
          <button
            class="win-btn"
            style="min-width: 80px"
            onclick="window.location.href = '/'"
          >
            I guessed.
          </button>
          <button
            class="win-btn"
            style="min-width: 80px"
            onclick="window.location.href = '/illorim'"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
