<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>One For All</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Only the animation rules; the cluster icons are styled in style.css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
      integrity="sha512-mQ77VzAakzdpWdgfL/lM1ksNy89uFgibRQANsNneSTMD/bj0Y/8+94XMwYhnbzx8eki2hrbPpDm0vD0CiT2lcg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <!-- markers.js reads its cluster tree (__parent/_zoom), so keep this version pinned -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"
      integrity="sha512-OFs3W4DIZ5ZkrDhBFtsCP6JXtMEDGmhl0QPlmWYBJay40TT1n3gt2Xuw8Pf/iezgW9CdabjkNChRqozl/YADmg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script src="/script.js" defer></script>
    <!-- A module, so it runs after the deferred Leaflet scripts above -->
    <script type="module" src="/one-for-all/map.js"></script>
  </head>
  <body onclick="closeStartMenu()">
    <div class="program-window" style="height: calc(100vh - 50px)">
      <div class="title-bar gradient">
        <div style="display: flex; align-items: center; gap: 5px">
          <img
            src="https://win98icons.alexmeub.com/icons/png/world_star-1.png"
            width="16"
            alt=""
          />
          <span id="map-title">One For All</span>
        </div>
        <div class="title-controls">
          <span>_</span>
          <span>□</span>
          <a href="/" aria-label="Close">X</a>
        </div>
      </div>

      <div class="map-toolbar" role="toolbar" aria-label="Map tools">
        <button
          type="button"
          class="win-btn toolbar-btn"
          id="locate-toggle"
          aria-pressed="false"
          aria-controls="locate-panel"
          title="Click a spot on the map to get its coordinates"
        >
          <img
            src="https://win98icons.alexmeub.com/icons/png/magnifying_glass-1.png"
            width="16"
            height="16"
            alt=""
          />
          Locate
        </button>
        <button
          type="button"
          class="win-btn toolbar-btn"
          id="party-button"
          title="Go to the party's current location"
          hidden
        >
          <img id="party-button-icon" src="" width="16" height="16" alt="" />
          Party
        </button>
        <button
          type="button"
          class="win-btn toolbar-btn"
          id="records-button"
          aria-haspopup="dialog"
          aria-expanded="false"
          title="List every record"
          hidden
        >
          <img
            src="https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png"
            width="16"
            height="16"
            alt=""
          />
          Records
        </button>
        <div class="find-box" role="search">
          <label for="find-input">Find:</label>
          <input
            id="find-input"
            class="win-input"
            type="search"
            placeholder="Name, place or word…  ( / )"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="find-results"
          />
          <ul id="find-results" class="find-results" role="listbox" aria-label="Matching records" hidden></ul>
        </div>
      </div>

      <div class="map-viewer">
        <div id="map" aria-label="Map of Faerûn"></div>

        <div id="locate-panel" class="locate-panel prop-window" hidden>
          <div class="title-bar">
            <span>Locate</span>
            <div class="title-controls">
              <button type="button" id="locate-close" aria-label="Exit locate mode">
                X
              </button>
            </div>
          </div>
          <div class="prop-body">
            <p id="locate-hint" style="margin-top: 0">Click the map to mark a spot.</p>
            <label for="locate-note">Note (optional)</label>
            <input
              id="locate-note"
              class="win-input"
              maxlength="80"
              placeholder="e.g. Frank's shop"
              autocomplete="off"
            />
            <label for="locate-output">Text to send</label>
            <input id="locate-output" class="win-input" readonly />
            <div style="text-align: right">
              <button type="button" class="win-btn" id="locate-copy" disabled>Copy</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="pin-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pin-name"
    >
      <div class="prop-window pin-window">
        <div class="title-bar">
          <span id="pin-name"></span>
          <div class="title-controls">
            <button type="button" class="pin-close" aria-label="Close">
              X
            </button>
          </div>
        </div>
        <div class="prop-body">
          <div class="pin-type">
            <img id="pin-icon" src="" width="32" height="32" alt="" />
            <b id="pin-type"></b>
          </div>
          <hr />
          <div id="pin-details" class="pin-details"></div>
          <div id="pin-connections"></div>
          <div id="pin-description" class="pin-description"></div>
          <div class="dialog-buttons">
            <button type="button" class="win-btn" id="pin-back" hidden></button>
            <button type="button" class="win-btn" id="pin-copy-link">Copy link</button>
            <button type="button" class="win-btn pin-close" id="pin-ok">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="place-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="place-name"
    >
      <div class="prop-window place-window">
        <div class="title-bar">
          <span id="place-name"></span>
          <div class="title-controls">
            <button type="button" class="place-close" aria-label="Close">
              X
            </button>
          </div>
        </div>
        <div class="prop-body">
          <div class="pin-type">
            <img id="place-icon" src="" width="32" height="32" alt="" />
            <b id="place-kind"></b>
          </div>
          <hr />
          <div id="place-description" class="pin-description"></div>
          <div id="place-contents"></div>
          <div class="dialog-buttons">
            <button type="button" class="win-btn" id="place-copy-link">Copy link</button>
            <button type="button" class="win-btn place-close" id="place-ok">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="records-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="records-title"
    >
      <div class="prop-window records-window">
        <div class="title-bar">
          <span id="records-title">Records</span>
          <div class="title-controls">
            <button type="button" class="records-close" aria-label="Close">X</button>
          </div>
        </div>
        <div class="prop-body">
          <div class="records-filters">
            <label>Type <select id="records-type"></select></label>
            <label>Status <select id="records-status"></select></label>
          </div>
          <div class="records-table-wrap">
            <table class="records-table">
              <thead>
                <tr>
                  <th data-sort="name" class="records-name"><button type="button">Name</button></th>
                  <th data-sort="type" class="records-type"><button type="button">Type</button></th>
                  <th data-sort="location" class="records-location"><button type="button">Location</button></th>
                  <th data-sort="status" class="records-status"><button type="button">Status</button></th>
                  <th data-sort="added" class="records-added"><button type="button">Added</button></th>
                </tr>
              </thead>
              <tbody id="records-rows"></tbody>
            </table>
          </div>
          <div class="records-footer">
            <span id="records-count" class="records-count" aria-live="polite"></span>
            <button type="button" class="win-btn records-close">OK</button>
          </div>
        </div>
      </div>
    </div>

    <div id="start-menu" class="start-menu" onclick="event.stopPropagation()">
      <div class="start-menu-sidebar">Windows 95</div>
      <a href="/" class="start-item">🏠 Home Desktop</a>
      <a href="/illorim" class="start-item">✨ Illorim (PEP)</a>
      <a href="/lists" class="start-item">📚 My Lists</a>
      <a href="/404" class="start-item">🚧 Construction</a>
      <hr style="width: 100%; margin: 0" />
      <a href="/shutdown" class="start-item">🚪 Shut Down...</a>
    </div>

    <div class="taskbar">
      <button
        type="button"
        id="start-button"
        class="start-button"
        onclick="toggleStartMenu(event)"
        aria-controls="start-menu"
        aria-expanded="false"
      >
        <img
          src="https://win98icons.alexmeub.com/icons/png/windows-0.png"
          width="16"
          alt=""
        />
        Start
      </button>

      <div class="active-app">
        <img
          src="https://win98icons.alexmeub.com/icons/png/world_star-1.png"
          width="16"
          style="margin-left: 10px"
          alt=""
        />
        OneForAll.exe
      </div>

      <div class="system-tray" id="clock">12:00 PM</div>
    </div>
  </body>
</html>
